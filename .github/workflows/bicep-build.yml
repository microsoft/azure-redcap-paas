## deploy azDeploySecureSub.bicep

name: Azure REDCap Deployment

on:
    workflow_dispatch:

    push:
        branches:
            - main

permissions:
    id-token: write
    contents: read

env:
    azCliVersion: 2.30.0
    environment: 'env-redcap'
    region: 'eastus'
            
jobs:
    # Validate the Bicep templates
    validateDeployment:
        runs-on: ubuntu-latest
        
        steps:
          - uses: actions/checkout@main
            name: Checkout

          - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
            name: Azure Login
            with:
              creds: ${{ secrets.AZURE_CREDENTIALS }}

          # Deploy Bicep file
          - name: validateTemplates
            uses: azure/arm-deploy@a1361c2c2cd398621955b16ca32e01c65ea340f5 # v2.0.0
            with:
              scope: 'subscription'
              template: ./main.bicep
              deploymentMode: 'Validate'
              region: ${{ env.region }}

          - name: planDeployment
            uses: azure/arm-deploy@a1361c2c2cd398621955b16ca32e01c65ea340f5 # v2.0.0
            with:
              scope: 'subscription'
              template: ./main.bicep
              additionalArguments: "--what-if"
              region: ${{ env.region }}
    
    # Deploy the resources
    deployResources:
      if: ( github.ref == 'refs/heads/main' )
      runs-on: ubuntu-latest
      environment: 'nonProduction' ## Replce with your environment name
      needs: [
        validateDeployment
      ]
      
      steps:
          - uses: actions/checkout@main
            name: Checkout

          - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
            name: Azure Login
            with:
              creds: ${{ secrets.AZURE_CREDENTIALS }}

          # Deploy Bicep file
          - name: deploy
            uses: azure/arm-deploy@a1361c2c2cd398621955b16ca32e01c65ea340f5 # v2.0.0
            with:
              scope: 'subscription'
              template: ./main.bicep
              region: ${{ env.region }}
